name: Private secrets and RLS
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mesa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm test
      - name: Apply schema, test idempotency, and exercise real PostgreSQL RLS
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: mesa_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017_individual_secrets.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017_individual_secrets.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/individual-secrets.sql
